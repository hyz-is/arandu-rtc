# What this package declares about itself.
#
# The declaration is capability, not intent, and `aru doctor` compares it with
# what the code imports and calls. A package that says it makes no outbound
# calls and then holds an HTTP client is rejected, which is what makes the
# four lines below worth reading before installing anything.

name = "hyz-is/rtc"
framework = ">= 0.56"
profiles = ["conventional", "performance"]

[permissions]
# It answers browsers' WebSocket handshakes on the application's own listener.
network = true
# It keeps no state outside memory: a camera's picture group lives as long as its source.
filesystem = false
# It runs no other program: the process that reads the camera is the installer's.
exec = false
# It owns no table.
migrations = false
